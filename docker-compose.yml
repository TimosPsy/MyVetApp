services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vetmvc9rest-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    ports:
      - "${DB_PORT:-1437}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 5

  sql-setup:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vetmvc9rest-db-setup
    volumes:
      - ./backend/MyVetApp/Resources/db/innit_db.sql:/usr/config/innit_db.sql:ro # Mounts the initialization script from the backend project folder as Read-Only (:ro)
    environment:
      # sqlcmd reads the SA password from SQLCMDPASSWORD automatically -> no -P flag, no shell quoting
      SQLCMDPASSWORD: "${SA_PASSWORD}"
      # sqlcmd resolves $(AppUserPassword) in the script from this env var when it isn't passed via -v
      AppUserPassword: "${DB_USER_PASSWORD}"
    depends_on:
      sqlserver:
        condition: service_healthy # Wait for the primary database container to pass its health check
    # Note: Connects as 'sa' (password via SQLCMDPASSWORD), runs the init script, then exits
    entrypoint:
      - "/opt/mssql-tools18/bin/sqlcmd"
      - "-S"
      - "sqlserver"
      - "-U"
      - "sa"
      - "-C"
      - "-b"
      - "-i"
      - "/usr/config/innit_db.sql"
 
  webapp:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: vetmvc-app
    ports:
      - "${APP_PORT:-8081}:8080"
    environment:
      Jwt__Issuer: "${JWT_ISSUER:-https://localhost:8081}"
      Jwt__Audience: "${JWT_AUDIENCE:-https://localhost:8081}"
      Jwt__Secret: "${JWT_SECRET}"
      Cors__Origin: "${CORS_ORIGINS:-http://localhost:5173}"
      AllowedHosts: "${ALLOWED_HOSTS:-*}"
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ConnectionStrings__DevConnection: "Server=${DB_HOST};Database=${DB_NAME};User=${DB_USER};Password=${DB_USER_PASSWORD};MultipleActiveResultSets=true;TrustServerCertificate=True" # Secure Connection String: The API connects via the isolated 'vet_app_user' account instead of the global 'sa' root
    depends_on:
      sqlserver:
        condition: service_healthy
      sql-setup:
        condition: service_completed_successfully # The API starts only AFTER the database and user are successfully created

  frontend:
    build: ./frontend
    container_name: vetmvc-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: "${VITE_API_URL:-http://localhost:8081/api/v1}"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - webapp

volumes:
  sqlserver-data:
